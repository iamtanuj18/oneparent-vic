<svg viewBox="0 0 520 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">how it works (straight)</title>
  <desc id="d2">quick inputs, ideas generated, plan ready</desc>

  <defs>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="rgba(0,0,0,.10)"/>
    </filter>
    <style>
      .card { fill:#fff; stroke:#e2e8f0; stroke-width:1 }
      .iconbg { fill:#f8fafc }
      .title { fill:#0f172a; font:600 20px Inter, system-ui, -apple-system }
    </style>
  </defs>

  <!-- stacked centered cards -->
  <g transform="translate(110,12)" filter="url(#sh2)">
    <rect class="card" x="0" y="0" rx="20" ry="20" width="300" height="150"/>
    <text class="title" x="150" y="30" text-anchor="middle">quick inputs from you</text>
    <g transform="translate(100,52)">
      <rect class="iconbg" x="0" y="0" width="100" height="62" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="12" y="15" width="50" height="10" rx="4" fill="#dbeafe"/>
      <rect x="12" y="33" width="36" height="10" rx="4" fill="#e2e8f0"/>
      <rect x="66" y="33" width="22" height="10" rx="5" fill="#86efac"/>
      <rect x="-10" y="62" width="120" height="8" rx="4" fill="#cbd5e1"/>
    </g>
  </g>

  <g transform="translate(110,202)" filter="url(#sh2)">
    <rect class="card" x="0" y="0" rx="20" ry="20" width="300" height="150"/>
    <text class="title" x="150" y="30" text-anchor="middle">we create ideas</text>
    <g transform="translate(100,60)">
      <circle cx="50" cy="30" r="26" fill="#fde68a"/>
      <rect x="46" y="56" width="8" height="10" rx="2" fill="#93c5fd"/>
      <path d="M43 54 h14" stroke="#60a5fa" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(110,392)" filter="url(#sh2)">
    <rect class="card" x="0" y="0" rx="20" ry="20" width="300" height="150"/>
    <text class="title" x="150" y="30" text-anchor="middle">your activity plan, ready to go</text>
    <g transform="translate(90,54)">
      <rect class="iconbg" x="0" y="0" width="120" height="80" rx="12" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M18 22 l10 10 l18 -18" stroke="#22c55e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="18" y="46" width="60" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="18" y="62" width="44" height="8" rx="4" fill="#e2e8f0"/>
    </g>
  </g>
</svg>
