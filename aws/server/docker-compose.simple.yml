# simplified docker compose for oneparent vic server production deployment

networks:
  oneparent-network:
    external: true

services:
  # production server container
  oneparent-server:
    image: oneparent-vic-server:latest
    container_name: oneparent-server
    restart: unless-stopped
    
    # internal port mapping - not exposed to host
    ports:
      - "127.0.0.1:5000:5000"
    
    # connect to shared network with redis
    networks:
      - oneparent-network
    
    # environment variables
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://oneparent-redis:6379
    
    # environment file for sensitive config
    env_file:
      - .env.production
    
    # health check configuration
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/api-status', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # resource limits for t3.micro
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.25'
    
    # logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"