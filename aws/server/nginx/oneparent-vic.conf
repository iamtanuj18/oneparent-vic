# nginx configuration for oneparent vic server
# handles reverse proxy, load balancing, ssl termination, and security

# upstream server configuration for blue-green deployment
upstream oneparent_backend {
    # blue deployment - default active server
    server 127.0.0.1:5000 weight=1 max_fails=3 fail_timeout=30s;
    
    # green deployment - used during deployments
    # server 127.0.0.1:5001 weight=1 max_fails=3 fail_timeout=30s;
    
    # enable keepalive connections
    keepalive 32;
}

# rate limiting configuration
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=health:10m rate=1r/s;

# server configuration for http (redirects to https)
server {
    listen 80;
    server_name your_domain_here;
    
    # redirect all http to https
    return 301 https://$server_name$request_uri;
}

# main server configuration for https
server {
    listen 443 ssl http2;
    server_name your_domain_here;
    
    # ssl certificate configuration
    ssl_certificate /etc/letsencrypt/live/your_domain_here/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your_domain_here/privkey.pem;
    
    # ssl security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; object-src 'none'; media-src 'self'; frame-src 'none';";
    
    # general server settings
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    
    # compression settings
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # health check endpoint (no rate limiting)
    location /api/api-status {
        limit_req zone=health burst=5 nodelay;
        
        proxy_pass http://oneparent_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # health check specific timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        # add health check headers
        add_header X-Health-Check "nginx-proxy";
    }
    
    # api endpoints with rate limiting
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://oneparent_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # standard timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # add api headers
        add_header X-API-Proxy "nginx";
    }
    
    # webhook endpoint (special handling)
    location /webhook {
        # allow only github webhook ips
        allow 140.82.112.0/20;  # github webhook ip range
        allow 185.199.108.0/22; # github webhook ip range
        allow 192.30.252.0/22;  # github webhook ip range
        deny all;
        
        proxy_pass http://127.0.0.1:3001;  # webhook receiver port
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # webhook specific timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }
    
    # nginx status endpoint (internal only)
    location /nginx-status {
        allow 127.0.0.1;
        deny all;
        
        stub_status on;
        access_log off;
    }
    
    # default location - return 404 for undefined routes
    location / {
        return 404 "endpoint not found";
    }
    
    # custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /var/www/html;
        internal;
    }
    
    location = /50x.html {
        root /var/www/html;
        internal;
    }
    
    # access logging
    access_log /var/log/nginx/oneparent-vic-access.log combined;
    error_log /var/log/nginx/oneparent-vic-error.log warn;
}