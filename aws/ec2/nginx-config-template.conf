# nginx configuration template for oneparent vic
# this file shows the complete nginx setup for production deployment
# includes ssl, security headers, rate limiting, and reverse proxy

# main nginx configuration optimizations
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;
    
    # mime types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    # access and error logs
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=health:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;
    
    # connection limiting
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    
    # file upload limits
    client_max_body_size 1M;
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    
    # timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    
    # upstream for nodejs application
    upstream nodejs_backend {
        server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # upstream for redis (if exposing redis api)
    upstream redis_backend {
        server 127.0.0.1:6379 max_fails=2 fail_timeout=10s;
    }
    
    # security headers map
    map $sent_http_content_type $security_headers {
        default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;";
    }
    
    # main server configuration
    server {
        listen 80;
        server_name _;
        
        # connection limits
        limit_conn perip 10;
        
        # security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $security_headers always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # api endpoints with rate limiting
        location /api/ {
            limit_req zone=api burst=5 nodelay;
            limit_req_status 429;
            
            # block suspicious requests
            if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$) {
                return 405;
            }
            
            # block common attack patterns
            if ($request_uri ~* "(union|select|insert|delete|drop|create|alter|exec|script|eval|expression)") {
                return 403;
            }
            
            # proxy to nodejs backend
            proxy_pass http://nodejs_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # proxy timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # proxy buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
        
        # health check endpoint
        location /health {
            limit_req zone=health burst=10 nodelay;
            
            proxy_pass http://nodejs_backend/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # shorter timeouts for health checks
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }
        
        # redis access (optional, for debugging only)
        location /redis/ {
            # only allow from localhost
            allow 127.0.0.1;
            deny all;
            
            limit_req zone=general burst=3 nodelay;
            
            # note: this would require additional redis http interface
            # proxy_pass http://redis_backend/;
            return 503 "redis access not enabled";
        }
        
        # nginx status for monitoring
        location /nginx-status {
            # only allow from localhost
            allow 127.0.0.1;
            deny all;
            
            stub_status on;
        }
        
        # block access to sensitive files and directories
        location ~ /\. {
            deny all;
        }
        
        location ~ \.(htaccess|htpasswd|ini|log|sh|sql|conf|bak|backup)$ {
            deny all;
        }
        
        location ~ ^/(config|logs|tmp|cache)/ {
            deny all;
        }
        
        # robots.txt
        location = /robots.txt {
            return 200 "User-agent: *\nDisallow: /\n";
            add_header Content-Type text/plain;
        }
        
        # favicon.ico
        location = /favicon.ico {
            return 204;
            access_log off;
            log_not_found off;
        }
        
        # default response for root and other paths
        location / {
            limit_req zone=general burst=10 nodelay;
            
            return 200 "oneparent vic api server is running\napi endpoints: /api/\nhealth check: /health\n";
            add_header Content-Type text/plain;
        }
        
        # custom error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            return 404 "endpoint not found";
            add_header Content-Type text/plain;
        }
        
        location = /50x.html {
            return 500 "server error";
            add_header Content-Type text/plain;
        }
    }

   