<svg width="640" height="520" viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PlayDate activity ideas shown on a phone with tags for time, mess, and cost">
  <defs>
    <!-- small drop shadow used on the chips -->
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(15,23,42,0.10)"></feDropShadow>
    </filter>
    <!-- gradient for animated progress bar -->
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd"></stop>
      <stop offset="1" stop-color="#22c55e"></stop>
    </linearGradient>
  </defs>

  <!-- phone shell -->
  <rect x="245" y="60" width="190" height="400" rx="32" fill="#0f172a" opacity="0.9"></rect>
  <rect x="250" y="70" width="180" height="380" rx="28" fill="#ffffff"></rect>
  <rect x="310" y="84" width="60" height="6" rx="3" fill="#e5e7eb"></rect>

  <!-- app header -->
  <text x="270" y="112" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">PlayDate</text>
  <rect x="250" y="122" width="180" height="1" fill="#e9eef5"></rect>

  <!-- activity cards -->
  <g transform="translate(262,140)">
    <rect width="156" height="86" rx="14" fill="#f8fafc" stroke="#e5e7eb"></rect>
    <rect x="12" y="16" width="108" height="12" rx="6" fill="#cbd5e1"></rect>
    <rect x="12" y="36" width="84" height="8" rx="4" fill="#e2e8f0"></rect>
    <rect x="12" y="52" width="72" height="8" rx="4" fill="#e2e8f0"></rect>
    <rect x="118" y="56" width="26" height="20" rx="10" fill="#0ea5e9"></rect>
  </g>

  <g transform="translate(262,234)">
    <rect width="156" height="86" rx="14" fill="#f8fafc" stroke="#e5e7eb"></rect>
    <rect x="12" y="16" width="120" height="12" rx="6" fill="#cbd5e1"></rect>
    <rect x="12" y="36" width="92" height="8" rx="4" fill="#e2e8f0"></rect>
    <rect x="12" y="52" width="104" height="8" rx="4" fill="#e2e8f0"></rect>
    <rect x="118" y="56" width="26" height="20" rx="10" fill="#22c55e"></rect>
  </g>

  <g transform="translate(262,328)">
    <rect width="156" height="86" rx="14" fill="#f8fafc" stroke="#e5e7eb"></rect>
    <rect x="12" y="16" width="96" height="12" rx="6" fill="#cbd5e1"></rect>
    <rect x="12" y="36" width="74" height="8" rx="4" fill="#e2e8f0"></rect>
    <rect x="12" y="52" width="88" height="8" rx="4" fill="#e2e8f0"></rect>
    <rect x="118" y="56" width="26" height="20" rx="10" fill="#f59e0b"></rect>
  </g>

  <!-- chips (with small shadow) -->
  <g filter="url(#shadow-sm)">
    <rect x="66" y="84" rx="12" width="154" height="44" fill="#ffffff" stroke="#e9eef5"></rect>
    <text x="82" y="111" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">
      Time: 30–60 min
    </text>
  </g>

  <g filter="url(#shadow-sm)">
    <rect x="480" y="88" rx="12" width="160" height="44" fill="#ffffff" stroke="#e9eef5"></rect>
    <text x="496" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">
      Energy: Low
    </text>
  </g>

  <g filter="url(#shadow-sm)">
    <rect x="66" y="390" rx="12" width="132" height="44" fill="#ffffff" stroke="#e9eef5"></rect>
    <text x="82" y="417" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">
      Cost: Free
    </text>
  </g>

  <!-- confetti dots -->
  <circle cx="520" cy="344" r="5" fill="#0ea5e9"></circle>
  <circle cx="496" cy="366" r="4" fill="#22c55e"></circle>
  <circle cx="108" cy="156" r="4" fill="#f59e0b"></circle>

  <!-- ===== status + progress animation under phone ===== -->
  <!-- progress track (subtle) -->
  <rect x="260" y="464" width="160" height="6" rx="3" fill="#eef2f7"></rect>

  <!-- moving bar -->
  <rect x="260" y="464" width="0" height="6" rx="3" fill="url(#barGrad)" opacity="0.9">
    <!-- animate width 0 -> 160 -> 0 over 6s -->
    <animate attributeName="width" values="0;160;0" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"></animate>
    <!-- slight fade in/out -->
    <animate attributeName="opacity" values="0.2;0.9;0.2" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"></animate>
  </rect>

  <!-- cycling status text -->
  <text x="340" y="486" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111827" opacity="1">
    Input…
    <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333;1" dur="6s" repeatCount="indefinite"></animate>
  </text>

  <text x="340" y="486" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111827" opacity="0">
    Generating…
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.333;0.666;1" dur="6s" repeatCount="indefinite"></animate>
  </text>

  <text x="340" y="486" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#0f172a" opacity="0">
    Results!
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.666;0.999;1" dur="6s" repeatCount="indefinite"></animate>
  </text>
</svg>
